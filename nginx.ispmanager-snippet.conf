# Сниппет для ISPmanager / FirstVDS и аналогичных панелей
#
# Панель создаёт vhost с root и include с location ~* \.(css|js|webp|…)$ —
# они перехватывают /_next/static/, /hero-*.webp, favicon и т.д. раньше location /.
#
# Решение: location ^~ / — модификатор ^~ отключает regex location панели для всех URL.
# Замените старый location / { proxy_pass … } на блок ниже (в обоих server: 80 и 443).
#
# Перед применением: pm2 list, curl -sI http://127.0.0.1:3000 — должен отвечать Next.

location ^~ / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
}
